# opt2 baseline secret scan. Replaced/extended by the shared pipeline template
# from opt2-tealbrick-platform (ci/). Fails the pipeline on any finding.
when:
  - event: [push, pull_request, manual]

steps:
  - name: secret-scan
    image: ghcr.io/gitleaks/gitleaks:v8.21.2
    commands:
      - gitleaks dir --redact --no-banner --verbose .
