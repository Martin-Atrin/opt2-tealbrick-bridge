# opt2 standard pipeline (template ci-v8).
# GENERATED from Martin-Atrin/opt2-tealbrick-platform: ci/woodpecker/ci.yaml.
# Do not edit this file in a repo: the "setup" step fails on any drift.
# Repo-specific settings go in tealbrick-ci.json. Change the standard in the platform repo.
# Clean-up: images are built by kaniko inside the step container (no host daemon images,
# no host socket, no privileged step); Woodpecker removes step containers and the workspace.
labels:
  platform: linux/amd64

when:
  - event: [pull_request, tag, manual]
  - event: push
    branch: main

steps:
  - name: secret-scan
    image: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    commands:
      - gitleaks dir --redact --no-banner --verbose .

  - name: setup
    image: &node node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment: &env
      CI: "true"
      TB_CI_REF: ci-v8
      TB_CI_SHA256: "ea00656c4a072d94313ff295c1b0a1ea77c64a2014273ec31d42cb786e2239ec"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    commands:
      - mkdir -p .tb-ci
      - curl -fsSL "https://raw.githubusercontent.com/Martin-Atrin/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o .tb-ci/tb-ci.ts
      - echo "$TB_CI_SHA256  .tb-ci/tb-ci.ts" | sha256sum -c -
      - node .tb-ci/tb-ci.ts setup

  - name: install
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts install

  - name: typecheck
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run typecheck

  - name: lint
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run lint

  - name: unit
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run test

  - name: conformance
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run conformance

  - name: build
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run build
      - node .tb-ci/tb-ci.ts plan-images

  # BSA-03: generated artefacts (openapi, kit, docs, railway) from the manifest. Required for kind miniapp.
  - name: gen
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts gen

  # Pull requests, pushes and manual runs: build every declared image, never push.
  - name: image-check
    image: &kaniko gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    commands:
      - sh .tb-ci/images.sh check
    when:
      - event: [pull_request, push, manual]

  # ---- Release steps (C62/BSD-10, SEC-03). Rule: a step that runs repo or dependency code holds no token;
  # a step that holds a token runs only the hash-checked template runner (copied to /tmp first) or the crane binary.

  # Release tags (v*): build every image to a tarball with OCI labels. No credentials.
  - name: image-build
    image: *kaniko
    commands:
      - sh .tb-ci/images.sh tar
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*): the hash-checked runner writes the push script (no repo code runs after this until the push).
  - name: push-prepare
    image: *node
    environment: *env
    commands:
      - cp .tb-ci/tb-ci.ts /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - node /tmp/tb-ci.ts push-script .tb-ci/push.sh
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*): push the tarballs to ghcr.io/martin-atrin/<image>:<version> (+ sha-<commit>). Token only here.
  - name: image-push
    image: gcr.io/go-containerregistry/crane:debug@sha256:e78770b31258a3846f878036d9c1f63fbe4c871f9f56990bf77fd95c013e3c1b
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - sh .tb-ci/push.sh
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*): validate and print the release. No token, no signing key; the manifest package is hash-checked.
  # The platform registry-sync pipeline discovers the tag, resolves the image digests in ghcr and signs the index.
  - name: release-record
    image: *node
    environment:
      CI: "true"
      TB_CI_SHA256: "ea00656c4a072d94313ff295c1b0a1ea77c64a2014273ec31d42cb786e2239ec"
      TB_MANIFEST_PKG: https://github.com/Martin-Atrin/opt2-tealbrick-sdk/releases/download/manifest-v0.1.3/opt2-tealbrick-manifest-0.1.3.tgz
      TB_MANIFEST_INTEGRITY: sha512-ueaiyKWlnjyW+JXHX52NlFIxBPaC6OTizIMKyDhJZrH/nd3vSvNjdSiJ7dpXd8xNDw7XP11aI0DKK8wEl6tFTQ==
    commands:
      - cp .tb-ci/tb-ci.ts /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - node /tmp/tb-ci.ts release-record
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*), miniapps: build the per-app kit (runs tb-gen from the repo's dependencies). No token.
  - name: kit-build
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts kit-build
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*), miniapps: attach kit tarball + sha256 (BSA-03). Token; hash-checked runner only.
  - name: kit-upload
    image: *node
    environment:
      CI: "true"
      TB_CI_SHA256: "ea00656c4a072d94313ff295c1b0a1ea77c64a2014273ec31d42cb786e2239ec"
      GITHUB_TOKEN:
        from_secret: ghcr_token
    commands:
      - cp .tb-ci/tb-ci.ts /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - node /tmp/tb-ci.ts kit-upload
    when:
      - event: tag
        ref: refs/tags/v*

  # Package tags (<package>-v<semver>): npm pack --ignore-scripts (in-repo deps rewritten to release URLs). No token.
  - name: package-pack
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts package-pack
    when:
      - event: tag
        ref: refs/tags/*-v*

  # Package tags: attach the tarball + sha256 to the GitHub release. Token; hash-checked runner only.
  - name: package-upload
    image: *node
    environment:
      CI: "true"
      TB_CI_SHA256: "ea00656c4a072d94313ff295c1b0a1ea77c64a2014273ec31d42cb786e2239ec"
      GITHUB_TOKEN:
        from_secret: ghcr_token
    commands:
      - cp .tb-ci/tb-ci.ts /tmp/tb-ci.ts
      - echo "$TB_CI_SHA256  /tmp/tb-ci.ts" | sha256sum -c -
      - node /tmp/tb-ci.ts package-upload
    when:
      - event: tag
        ref: refs/tags/*-v*
