# opt2 standard pipeline (template ci-v7).
# GENERATED from Martin-Atrin/opt2-tealbrick-platform: ci/woodpecker/ci.yaml.
# Do not edit this file in a repo: the "setup" step fails on any drift.
# Repo-specific settings go in tealbrick-ci.json. Change the standard in the platform repo.
# Clean-up: images are built by kaniko inside the step container (no host daemon images,
# no host socket, no privileged step); Woodpecker removes step containers and the workspace.
labels:
  platform: linux/amd64

when:
  - event: [pull_request, tag, manual]
  - event: push
    branch: main

steps:
  - name: secret-scan
    image: ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
    commands:
      - gitleaks dir --redact --no-banner --verbose .

  - name: setup
    image: &node node:24.21.0-bookworm@sha256:3d27e5c11e5786e309ec3e03f93ae536eb36e6e5eb3714d5eb3300a36157add0
    environment: &env
      CI: "true"
      TB_CI_REF: ci-v7
      TB_CI_SHA256: "48cadf8c200bc97f70c0c67ef79c3a0a81e6f34a8faf798a5cee882420553988"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
      NPM_CONFIG_FUND: "false"
      NPM_CONFIG_AUDIT: "false"
    commands:
      - mkdir -p .tb-ci
      - curl -fsSL "https://raw.githubusercontent.com/Martin-Atrin/opt2-tealbrick-platform/$TB_CI_REF/ci/tb-ci.ts" -o .tb-ci/tb-ci.ts
      - echo "$TB_CI_SHA256  .tb-ci/tb-ci.ts" | sha256sum -c -
      - node .tb-ci/tb-ci.ts setup

  - name: install
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts install

  - name: typecheck
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run typecheck

  - name: lint
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run lint

  - name: unit
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run test

  - name: conformance
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run conformance

  - name: build
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts run build
      - node .tb-ci/tb-ci.ts plan-images

  # BSA-03: generated artefacts (openapi, kit, docs, railway) from the manifest. Required for kind miniapp.
  - name: gen
    image: *node
    environment: *env
    commands:
      - node .tb-ci/tb-ci.ts gen

  # Pull requests, pushes and manual runs: build every declared image, never push.
  - name: image-check
    image: &kaniko gcr.io/kaniko-project/executor:v1.24.0-debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    commands:
      - sh .tb-ci/images.sh check
    when:
      - event: [pull_request, push, manual]

  # Release tags (v*): build and push to ghcr.io/martin-atrin/<image>:<tag>, record digests.
  - name: image-publish
    image: *kaniko
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - sh .tb-ci/images.sh publish
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*): release CANDIDATE (image digests) as a GitHub release asset. No signing key here (SEC-03):
  # the platform signer pipeline verifies the candidate independently and signs the release index.
  - name: release-record
    image: *node
    environment:
      CI: "true"
      TB_MANIFEST_PKG: https://github.com/Martin-Atrin/opt2-tealbrick-sdk/releases/download/manifest-v0.1.3/opt2-tealbrick-manifest-0.1.3.tgz
      GITHUB_TOKEN:
        from_secret: ghcr_token
    commands:
      - node .tb-ci/tb-ci.ts release-record
    when:
      - event: tag
        ref: refs/tags/v*

  # Release tags (v*), miniapps: per-app kit tarball + sha256 on the GitHub release (BSA-03).
  - name: kit-release
    image: *node
    environment:
      CI: "true"
      GITHUB_TOKEN:
        from_secret: ghcr_token
    commands:
      - node .tb-ci/tb-ci.ts kit-release
    when:
      - event: tag
        ref: refs/tags/v*

  # Package tags (<package>-v<semver>, multi-package repos): npm pack that workspace package
  # (in-repo deps rewritten to their release URLs) -> tarball asset on the GitHub release.
  - name: package-release
    image: *node
    environment:
      CI: "true"
      GITHUB_TOKEN:
        from_secret: ghcr_token
    commands:
      - node .tb-ci/tb-ci.ts package-release
    when:
      - event: tag
        ref: refs/tags/*-v*
